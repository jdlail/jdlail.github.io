<script>
    if ('querySelector' in document && 'addEventListener' in window) {
        document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + 'js';
    }
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ site.skin | default: '/assets/css/skins/default.css' | relative_url }}">

{% if site.google_fonts %}
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family={%- for font in site.google_fonts -%}{{ font.name | replace: ' ', '+' }}{% if font.weights %}:{% endif %}{{ font.weights | remove: ' ' }}{% if forloop.last != true %}|{% endif %}{%- endfor -%}">
{% endif %}

{% if site.head_scripts %}
{% for script in site.head_scripts %}
<script src="{% if script contains '://' %}{{ script }}{% else %}{{ script | absolute_url }}{% endif %}"></script>
{% endfor %}
{% endif %}
